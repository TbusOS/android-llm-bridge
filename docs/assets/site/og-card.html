<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>og card source</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../v3/tokens.css">
<link rel="stylesheet" href="site.css">
<style>
  /* Source for og.png (1200x630 social preview). Re-render: node web/scripts/render_site_og.mjs */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--md-sys-color-surface); position: relative; }
  .s1 { width: 420px; height: 420px; right: -110px; top: -120px; background: var(--md-sys-color-primary-container); }
  .s2 { width: 230px; height: 230px; left: -70px; bottom: -80px; background: var(--site-kernel-container); }
  .s3 { width: 130px; height: 130px; left: 560px; top: 36px; background: var(--site-job-container); }
  .s4 { width: 260px; height: 86px; right: 120px; bottom: -30px; background: var(--md-sys-color-tertiary-container); transform: rotate(-18deg); }
  .og { position: absolute; left: 72px; top: 64px; right: 72px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; color: var(--md-sys-color-on-surface); }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 40px 0 0; font-size: 84px; line-height: 1.0; letter-spacing: -2.5px; font-weight: 520; max-width: 900px; }
  h1 em { font-style: normal; color: var(--md-sys-color-primary); }
  p { margin-top: 28px; font-size: 27px; line-height: 1.4; color: var(--md-sys-color-on-surface-variant); max-width: 860px; }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 10px; }
  .chips span { height: 44px; padding: 0 18px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 20px; font-weight: 500;
    background: var(--alb-color-card); border: 1px solid var(--md-sys-color-outline-variant); color: var(--md-sys-color-on-surface); }
</style>
</head>
<body>
  <span class="shape shape--cookie s1"></span>
  <span class="shape shape--clover s2"></span>
  <span class="shape shape--sunny s3"></span>
  <span class="shape shape--pill s4"></span>
  <div class="og">
    <div class="brand"><img src="favicon.svg" alt="">android-llm-bridge</div>
    <h1>Give every AI agent a <em>debug cable</em>.</h1>
    <p>Claude Code, Codex, Cursor or your own model — flashing, watching and debugging real boards, locally or on a remote bench.</p>
  </div>
  <div class="chips"><span>MCP</span><span>adb</span><span>UART</span><span>fastboot</span><span>EDL</span><span>Apache 2.0</span></div>
</body>
</html>
